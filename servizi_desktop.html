<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Casse</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#9DBF60;--grigio:#77797a;--grigio-chiaro:#aaaaaa;
  --navy:#4A4C4D;--blue-light:#D5E3B7;--blue-xlight:#EEF5E3;
  --accent:#9DBF60;
  --red:#C0392B;--red-light:#FDECEA;
  --green:#9DBF60;--green-light:#EEF5E3;
  --amber:#9a6d00;--amber-light:#FFF9E6;
  --g50:#F8F9F8;--g100:#F0F2EE;--g200:#E2E6DF;--g300:#C8CEC4;
  --g500:#77797a;--g700:#4A4C4D;--g900:#2A2C2D;
  --sh-sm:0 1px 3px rgba(74,76,77,.08),0 1px 2px rgba(74,76,77,.05);
  --sh-md:0 4px 12px rgba(74,76,77,.10);
  --sh-lg:0 12px 32px rgba(74,76,77,.14),0 4px 10px rgba(74,76,77,.07);
  --r:10px;--rsm:6px;--rlg:16px;
  font-family:'Raleway',sans-serif;
}
body{background:var(--g50);color:var(--g900);min-height:100vh;font-size:14px}
.hid{display:none!important}

/* ── App layout ── */
#app{display:flex;flex-direction:column;min-height:100vh}
#topbar{background:#fff;border-bottom:1px solid var(--g200);padding:0 28px;position:sticky;top:0;z-index:200;box-shadow:var(--sh-sm)}
#tb-top{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--g100)}
#tb-logo{display:flex;align-items:center}
#tb-right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--g500)}
#tb-user{font-weight:600;color:var(--g700)}
#tb-nav{height:40px;display:flex;align-items:stretch}
.tnb{display:flex;align-items:center;gap:6px;padding:0 16px;font-size:12.5px;font-weight:600;color:var(--g500);cursor:pointer;border:none;background:none;font-family:'Raleway',sans-serif;letter-spacing:.3px;border-bottom:2.5px solid transparent;transition:all .17s;text-transform:uppercase}
.tnb-drop{position:relative;display:flex}
.tnb-menu{position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--g200);border-radius:var(--rsm);box-shadow:var(--sh-lg);min-width:180px;z-index:300;padding:6px;margin-top:1px}
.tnb-item{display:block;width:100%;text-align:left;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--g700);background:none;border:none;border-radius:var(--rsm);cursor:pointer;font-family:'Raleway',sans-serif;text-transform:none;letter-spacing:0}
.tnb-item:hover{background:var(--g100)}
.tnb-item.active{background:var(--blue-xlight);color:var(--verde)}
.tnb:hover{color:var(--g700);border-bottom-color:var(--g300)}
.tnb.active{color:var(--verde);border-bottom-color:var(--verde)}
#main{flex:1;display:flex;flex-direction:column}
#pb{padding:24px;flex:1;max-width:1280px;width:100%;margin:0 auto}
#lout{font-size:12px;font-weight:600;padding:6px 14px;background:none;border:1px solid var(--g300);border-radius:var(--rsm);color:var(--g500);transition:all .17s;cursor:pointer;font-family:'Raleway',sans-serif}
#lout:hover{background:var(--g100);color:var(--g700)}

/* ── Login ── */
#lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--g50)}
.lcard{background:#fff;border-radius:var(--rlg);padding:40px 38px;width:100%;max-width:420px;box-shadow:var(--sh-lg);border:1px solid var(--g200)}
.lfield{margin-bottom:16px}
.lfield label{display:block;font-size:12px;font-weight:600;color:var(--g700);letter-spacing:.5px;margin-bottom:6px}
.lfield input{width:100%;padding:11px 14px;border:1px solid var(--g200);border-radius:var(--rsm);background:#EEF5E3;font-family:'Raleway',sans-serif;font-size:14px;color:var(--g900);outline:none;transition:border-color .2s}
.lfield input:focus{border-color:var(--verde)}
.lbtn{width:100%;padding:12px;background:var(--verde);color:#fff;border:none;border-radius:var(--rsm);font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s}
.lbtn:hover{opacity:.88}
.lerr{background:var(--red-light);color:var(--red);border-radius:var(--rsm);padding:10px 14px;font-size:13px;margin-top:14px;display:none}
.spn{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Buttons / badges / forms ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:var(--rsm);font-family:'Raleway',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .17s;white-space:nowrap}
.bpg{background:var(--verde);color:#fff}.bpg:hover{background:#7da048}
.bs{background:var(--g100);color:var(--g700);border:1px solid var(--g200)}.bs:hover{background:var(--g200)}
.bd{background:var(--red-light);color:var(--red)}.bd:hover{background:var(--red);color:#fff}
.bic{padding:6px;border-radius:var(--rsm);background:var(--g100);border:1px solid var(--g200);cursor:pointer;transition:all .17s;font-size:14px;font-family:'Raleway',sans-serif}.bic:hover{background:var(--g200)}
.bamb{background:var(--amber-light);color:var(--amber);border:1px solid #e6c800}.bamb:hover{background:#f0dc78}

.bg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.bg-on{background:var(--green-light);color:#1A7A40}.bg-off{background:var(--g100);color:var(--g500)}
.bg-adm{background:var(--navy);color:#fff}.bg-usr{background:var(--g100);color:var(--g700)}
.bg-resp{background:#E8F0FB;color:#3B7DD8}.bg-cont{background:var(--amber-light);color:var(--amber)}
.bg-amber{background:var(--amber-light);color:var(--amber)}.bg-red{background:var(--red-light);color:var(--red)}
.bg-green{background:var(--green-light);color:#1A7A40}
.bg-aperta{background:var(--green-light);color:#1A7A40}
.bg-chiusa{background:var(--g100);color:var(--g500)}
.bg-sbloccata{background:var(--amber-light);color:var(--amber)}

.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fl{font-size:11.5px;font-weight:700;color:var(--g700);text-transform:uppercase;letter-spacing:.4px}
.fi,.fse,.fta{padding:8px 11px;border:1.5px solid var(--g300);border-radius:var(--rsm);font-family:'Raleway',sans-serif;font-size:13.5px;color:var(--g900);background:#fff;outline:none;transition:border-color .17s,box-shadow .17s;width:100%}
.fi:focus,.fse:focus,.fta:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(157,191,96,.15)}
.fta{resize:vertical;min-height:70px}.fse{cursor:pointer}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.alert{padding:11px 15px;border-radius:var(--rsm);font-size:13px;display:flex;align-items:flex-start;gap:9px;line-height:1.5}
.ai{background:var(--blue-xlight);color:var(--navy)}
.aw{background:var(--red-light);color:var(--red)}
.ag{background:var(--green-light);color:#1A7A40}
.aa{background:var(--amber-light);color:var(--amber)}

.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{padding:9px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;background:var(--g50);border-bottom:2px solid var(--g200)}
.dt td{padding:10px 14px;border-bottom:1px solid var(--g100);color:var(--g700);vertical-align:middle}
.dt tr:last-child td{border-bottom:none}.dt tr:hover td{background:var(--g50)}

.tw{display:flex;align-items:center;gap:9px;cursor:pointer}
.tg{position:relative;width:36px;height:20px;flex-shrink:0}
.tg input{opacity:0;width:0;height:0}
.tsl{width:36px;height:20px;background:var(--g300);border-radius:10px;transition:background .2s;display:block;cursor:pointer;position:absolute;top:0;left:0}
.tsl::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+.tsl{background:var(--verde)}
.tg input:checked+.tsl::after{transform:translateX(16px)}

/* ── Modale ── */
.mo{position:fixed;inset:0;background:rgba(74,76,77,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.mc{background:#fff;border-radius:var(--rlg);box-shadow:var(--sh-lg);width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;animation:mfade .18s ease}
.mc.wide{width:min(780px,100%)}
@keyframes mfade{from{opacity:0;transform:scale(.97)}}
.mh{padding:18px 20px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mt{font-size:15px;font-weight:700}.mbdy{padding:20px;overflow-y:auto;flex:1}.mf{padding:14px 20px;border-top:1px solid var(--g200);display:flex;gap:9px;justify-content:flex-end;flex-shrink:0}

/* ── Toast ── */
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));right:24px;z-index:9999;padding:13px 18px;border-radius:var(--r);font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .25s;max-width:380px;background:#fff}
#toast.show{opacity:1;pointer-events:auto}
#toast.tok{background:#EAF5DE;color:#1A7A40;border-left:3px solid var(--verde)}
#toast.terr{background:#FBE2DE;color:var(--red);border-left:3px solid var(--red)}

/* ── Dashboard / stat cards ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm)}
.stat-val{font-size:28px;font-weight:800;color:var(--navy);line-height:1}
.stat-val.red{color:var(--red)}.stat-val.green{color:#1A7A40}.stat-val.amber{color:var(--amber)}
.stat-label{font-size:11px;color:var(--g500);margin-top:4px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}

.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-hdr h1{font-size:19px;font-weight:700;color:var(--navy)}
.filters{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--g200);background:#fff;color:var(--g500);cursor:pointer;transition:all .15s}
.filter-chip:hover{border-color:var(--verde);color:var(--verde)}
.filter-chip.active{background:var(--blue-xlight);border-color:var(--verde);color:var(--verde)}
.search-wrap{position:relative}
.search-wrap input{padding:7px 12px 7px 30px;border:1px solid var(--g200);border-radius:var(--r);font-family:'Raleway',sans-serif;font-size:13px;color:var(--g900);background:#fff;outline:none;width:220px}
.search-wrap input:focus{border-color:var(--verde)}
.search-wrap::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px}

.empty-row{text-align:center;padding:40px 20px;color:var(--g500)}
.card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);box-shadow:var(--sh-sm);margin-bottom:16px}
.card-head{padding:14px 18px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.card-body{padding:18px}
.card-title{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}

/* ── Casse week nav ── */
.week-nav{display:flex;align-items:center;gap:10px}
.week-nav button{padding:6px 12px;font-size:12px;font-weight:700;border:1.5px solid var(--g200);border-radius:var(--rsm);background:#fff;color:var(--g700);cursor:pointer;transition:all .15s;font-family:'Raleway',sans-serif}
.week-nav button:hover{border-color:var(--verde);color:var(--verde)}
.week-label{font-size:14px;font-weight:700;color:var(--navy);min-width:200px;text-align:center}

/* ── Casse operatori grid ── */
.op-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.op-card{background:#fff;border:1px solid var(--g200);border-radius:var(--r);box-shadow:var(--sh-sm);overflow:hidden}
.op-card-head{padding:12px 16px;background:var(--g50);border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.op-card-name{font-weight:700;color:var(--navy);font-size:13px}
.op-card-body{padding:14px 16px}
.op-stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--g100);font-size:12.5px}
.op-stat:last-child{border-bottom:none;padding-top:8px;margin-top:3px}
.op-stat-label{color:var(--g500);font-weight:600}
.op-stat-val{font-weight:700;color:var(--g900)}
.op-stat-val.pos{color:#1A7A40}.op-stat-val.neg{color:var(--red)}.op-stat-val.total{font-size:15px;color:var(--navy)}

/* ── Riepilogo sede ── */
.riepilogo-sede{background:var(--blue-xlight);border:1.5px solid var(--verde);border-radius:var(--r);padding:16px 20px;margin-bottom:20px}
.riepilogo-sede h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rs-item{background:#fff;border-radius:var(--rsm);padding:10px 14px;border:1px solid var(--blue-light)}
.rs-val{font-size:20px;font-weight:800;color:var(--navy)}
.rs-lbl{font-size:10.5px;color:var(--g500);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}

/* ── Movimenti table ── */
tr.row-uscita td{background:#FFF9E6}
tr.row-uscita-ndc td{background:var(--red-light)}
.tipo-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.tipo-contante{background:#E8F0FB;color:#3B7DD8}
.tipo-assegno{background:var(--blue-xlight);color:var(--verde)}
.tipo-ndc{background:var(--red-light);color:var(--red)}
.tipo-varie{background:var(--amber-light);color:var(--amber)}

/* ── Conferma contabilità ── */
.conf-box{background:#fff;border:1.5px solid var(--g200);border-radius:var(--r);padding:18px;margin-bottom:16px}
.conf-box.confirmed{border-color:var(--verde);background:var(--green-light)}
.conf-box.delta-neg{border-color:var(--red);background:var(--red-light)}

/* ── Pagination ── */
.pag{display:flex;align-items:center;gap:6px;margin-top:14px;justify-content:flex-end}
.pag button{padding:5px 11px;border:1px solid var(--g200);border-radius:var(--rsm);background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:'Raleway',sans-serif;color:var(--g700)}
.pag button.active{background:var(--verde);color:#fff;border-color:var(--verde)}
.pag button:hover:not(.active){background:var(--g100)}
.pag-info{font-size:12px;color:var(--g500);margin-right:6px}

/* ── Upload preview ── */
.file-preview{margin-top:8px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--g700);background:var(--g100);border-radius:var(--rsm);padding:8px 12px}
.file-preview a{color:var(--verde);font-weight:600}
</style>
</head>
<body>

<div id="toast"></div>

<!-- LOGIN -->
<div id="lp">
  <div class="lcard">
    <div id="login-logo"></div>
    <div style="margin-top:14px;font-size:13px;color:var(--grigio);text-align:center">Accesso riservato al personale autorizzato</div>
    <div id="lerr" class="lerr"></div>
    <div class="lfield" style="margin-top:16px"><label>E-Mail</label><input type="email" id="lem" placeholder="nome@medicalgroup.it" autocomplete="username"></div>
    <div class="lfield"><label>Password</label><input type="password" id="lpw" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="lbtn" id="lbtn" onclick="doLogin()">Accedi</button>
    <div id="login-ver" style="margin-top:14px;font-size:10px;color:var(--grigio-chiaro);text-align:center;letter-spacing:.5px"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hid">
  <div id="topbar">
    <div id="tb-top">
      <div id="tb-logo"></div>
      <div id="tb-right">
        <span id="tb-sede" style="font-size:12px;color:var(--g500)"></span>
        <span id="tb-user"></span>
        <span id="tb-role"></span>
        <button id="lout" onclick="doLogout()">Esci</button>
      </div>
    </div>
    <nav id="tb-nav"></nav>
  </div>
  <main id="main"><div id="pb"></div></main>
</div>

<!-- MODALE GENERICA -->
<div class="mo hid" id="mov">
  <div class="mc" id="mc">
    <div class="mh"><span class="mt" id="mtit">—</span><button class="bic" id="mcls">✕</button></div>
    <div class="mbdy" id="mbdy"></div>
    <div class="mf" id="mft"></div>
  </div>
</div>

<script>
'use strict';
// ══════════════════════════════════════════
// CONFIG
// ══════════════════════════════════════════
const CFG={
  URL:'https://iczsdqcnvauopwkuspti.supabase.co',
  KEY:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljenNkcWNudmF1b3B3a3VzcHRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NTQ0MjMsImV4cCI6MjA5MjQzMDQyM30.SmcRHPLM2PEq4Hn-5CQhMyQKoz0PN_0lbN_X3l9MNUE',
  FN:'https://iczsdqcnvauopwkuspti.supabase.co/functions/v1',
};
const T=n=>`casse_${n}`;
const VER='1.0.0';

const NAV_MAIN=[
  {id:'cassa',    l:'La mia cassa', r:['operatore']},
  {id:'sede',     l:'Sede',         r:['responsabile']},
  {id:'overview', l:'Overview',     r:['admin','contabilita']},
];
const NAV_ADMIN=[
  {id:'conferme',   l:'Conferme contabilità', r:['admin','contabilita']},
  {id:'utenti',     l:'Utenti',               r:['admin']},
  {id:'log',        l:'Log attività',          r:['admin']},
  {id:'impostazioni',l:'Impostazioni',         r:['admin']},
];

const S={
  user:null,token:null,
  profili:[],sedi:[],config:{},
  settimane:[],movimenti:[],conferme:[],log:[],
  page:'',
  // filtri
  logPage:0,logSrch:'',
  movPage:0,movFiltroTipo:'',
  // settimana corrente (ISO)
  weekOffset:0, // 0=corrente, -1=precedente...
  sedeId:null,  // override sede per admin
};

// ════════════════
// UTILS
// ════════════════
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmt(d){if(!d)return'—';const dt=typeof d==='string'?new Date(d.length===10?d+'T00:00:00':d):d;return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtDT(d){if(!d)return'—';const dt=new Date(d);return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});}
function eur(n){if(n==null||n==='')return'—';return Number(n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function eurSign(n){if(n==null||n==='')return'—';const v=Number(n);return(v>=0?'+':'')+v.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function fullName(p){return p?`${p.nome||''} ${p.cognome||''}`.trim():'—';}
function profById(id){return S.profili.find(p=>p.id===id);}
function sedeById(id){return S.sedi.find(s=>s.id===id);}
function sedeLabel(id){const s=sedeById(id);return s?s.nome||s.indirizzo||'Sede':'—';}

let _tid;
function toast(msg,type='ok'){
  const el=$('toast');clearTimeout(_tid);
  el.textContent=msg;el.className=`show t${type}`;
  _tid=setTimeout(()=>el.className='',3200);
}

// ── Settimana ISO ────────────────────────────────────────
function getISOWeek(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=dt.getUTCDay()||7;
  dt.setUTCDate(dt.getUTCDate()+4-day);
  const yearStart=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return{anno:dt.getUTCFullYear(),settimana:Math.ceil((((dt-yearStart)/86400000)+1)/7)};
}
function getMondayOfISOWeek(anno,settimana){
  const simple=new Date(anno,0,1+( settimana-1)*7);
  const dow=simple.getDay();
  const ISOweekStart=new Date(simple);
  if(dow<=4)ISOweekStart.setDate(simple.getDate()-simple.getDay()+1);
  else ISOweekStart.setDate(simple.getDate()+8-simple.getDay());
  return ISOweekStart;
}
function currentWeekInfo(){
  const base=new Date();
  base.setDate(base.getDate()+S.weekOffset*7);
  const{anno,settimana}=getISOWeek(base);
  const lun=getMondayOfISOWeek(anno,settimana);
  const dom=new Date(lun);dom.setDate(lun.getDate()+6);
  return{anno,settimana,lun,dom};
}
function weekLabel(){
  const{anno,settimana,lun,dom}=currentWeekInfo();
  return`Settimana ${settimana} / ${anno} — ${fmt(lun)} → ${fmt(dom)}`;
}

async function db(method,table,opts={}){
  const{flt='',body=null,sel='*',ord='',lim='',cnt=false}=opts;
  let url=`${CFG.URL}/rest/v1/${table}?select=${sel}`;
  if(flt)url+=`&${flt}`;if(ord)url+=`&order=${ord}`;if(lim)url+=`&limit=${lim}`;
  const headers={'apikey':CFG.KEY,'Authorization':`Bearer ${S.token||CFG.KEY}`,'Content-Type':'application/json','Prefer':method==='POST'||method==='PATCH'?'return=representation':cnt?'count=exact':''};
  if(cnt)headers['Range-Unit']='items';
  const res=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined});
  if(!res.ok){const e=await res.text();throw new Error(`${method} ${table}: ${e}`);}
  if(method==='DELETE')return null;
  if(cnt){const data=await res.json();const range=res.headers.get('Content-Range');const tot=range?parseInt(range.split('/')[1])||0:0;return{data,tot};}
  return res.json();
}
async function supaLogin(email,pwd){
  const res=await fetch(`${CFG.URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':CFG.KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
  const data=await res.json();
  if(!res.ok)throw new Error(data.error_description||data.error||data.msg||'Errore di autenticazione');
  return data;
}
async function callFn(name,body){
  const res=await fetch(`${CFG.FN}/${name}`,{method:'POST',headers:{'Authorization':`Bearer ${S.token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  return res.json();
}
async function writeLog(azione,dettagli){
  try{await db('POST',T('log'),{body:[{utente_id:S.user?.id||null,azione,dettagli:dettagli||null}]});}catch(e){}
}

// ── Storage / signed URLs ────────────────────────────────
const _signedUrlCache={};
async function getSignedUrl(bucket,path){
  if(!path)return null;
  const k=`${bucket}/${path}`;
  const c=_signedUrlCache[k];
  if(c&&c.exp>Date.now())return c.url;
  const res=await fetch(`${CFG.URL}/storage/v1/object/sign/${bucket}/${path}`,{
    method:'POST',headers:{'apikey':CFG.KEY,'Authorization':`Bearer ${S.token||CFG.KEY}`,'Content-Type':'application/json'},
    body:JSON.stringify({expiresIn:3600}),
  });
  if(!res.ok)return null;
  const d=await res.json();
  const url=`${CFG.URL}/storage/v1${d.signedURL}`;
  _signedUrlCache[k]={url,exp:Date.now()+55*60*1000};
  return url;
}
async function uploadGiustificativo(file,movimentoId){
  const ext=file.name.split('.').pop();
  const path=`${S.user.id}/${movimentoId}.${ext}`;
  const res=await fetch(`${CFG.URL}/storage/v1/object/casse-giustificativi/${path}`,{
    method:'POST',
    headers:{'apikey':CFG.KEY,'Authorization':`Bearer ${S.token}`,'Content-Type':file.type,'Cache-Control':'3600'},
    body:file,
  });
  if(!res.ok)throw new Error('Errore upload giustificativo');
  return path;
}

async function doLogin(){
  const email=$('lem').value.trim(),pwd=$('lpw').value;
  const btn=$('lbtn'),err=$('lerr');
  err.style.display='none';
  if(!email||!pwd){err.textContent='Inserisci email e password.';err.style.display='block';return;}
  btn.innerHTML='<span class="spn"></span> Accesso…';btn.disabled=true;
  try{
    const auth=await supaLogin(email,pwd);
    S.token=auth.access_token;
    const rows=await db('GET',T('profili'),{flt:`id=eq.${auth.user.id}`});
    if(!rows?.length)throw new Error('Profilo non trovato. Contatta l\'amministratore.');
    if(rows[0].attivo===false)throw new Error('Utente disabilitato. Contatta l\'amministratore.');
    S.user=rows[0];
    await loadAll();
    $('lp').classList.add('hid');$('app').classList.remove('hid');
    renderTopNav();
    const startPage={operatore:'cassa',responsabile:'sede',admin:'overview',contabilita:'overview'}[S.user.ruolo]||'overview';
    goPage(startPage);
    writeLog('login',{});
  }catch(e){err.textContent=e.message;err.style.display='block';btn.innerHTML='Accedi';btn.disabled=false;}
}
function doLogout(){
  S.user=null;S.token=null;
  $('app').classList.add('hid');$('lp').classList.remove('hid');
  $('lem').value='';$('lpw').value='';
  $('lerr').style.display='none';
}

async function loadAll(){
  const ruolo=S.user.ruolo;
  // Sedi
  S.sedi=await db('GET','sedi_sedi',{ord:'nome.asc',flt:'attiva=eq.true'});
  // Config
  const cfgRows=await db('GET',T('config'),{flt:'id=eq.1'});
  S.config=cfgRows?.[0]||{fondo_default:200};
  // Profili (admin/resp vedono tutti quelli della sede, operatore solo sé stesso)
  if(ruolo==='admin'||ruolo==='contabilita'){
    S.profili=await db('GET',T('profili'),{ord:'cognome.asc,nome.asc'});
  } else if(ruolo==='responsabile'){
    S.profili=await db('GET',T('profili'),{flt:`sede_id=eq.${S.user.sede_id}`,ord:'cognome.asc,nome.asc'});
  } else {
    S.profili=[S.user];
  }
  // Settimana corrente — caricata on demand nelle pagine
  S.sedeId=S.user.sede_id;
}
async function loadSettimanaCorrente(){
  const{anno,settimana}=currentWeekInfo();
  const sedeId=S.sedeId||S.user.sede_id;
  if(!sedeId)return null;
  const rows=await db('GET',T('settimane'),{flt:`sede_id=eq.${sedeId}&anno=eq.${anno}&settimana=eq.${settimana}`});
  return rows?.[0]||null;
}
async function getOrCreateSettimana(){
  const{anno,settimana,lun}=currentWeekInfo();
  const sedeId=S.sedeId||S.user.sede_id;
  const rows=await db('GET',T('settimane'),{flt:`sede_id=eq.${sedeId}&anno=eq.${anno}&settimana=eq.${settimana}`});
  if(rows?.length)return rows[0];
  // Crea
  const lunStr=lun.toISOString().split('T')[0];
  const created=await db('POST',T('settimane'),{body:[{sede_id:sedeId,anno,settimana,data_lunedi:lunStr}]});
  return created[0];
}
async function loadMovimenti(settimanaId){
  if(!settimanaId)return[];
  let flt=`settimana_id=eq.${settimanaId}`;
  if(S.user.ruolo==='operatore')flt+=`&operatore_id=eq.${S.user.id}`;
  return await db('GET',T('movimenti'),{flt,ord:'data_movimento.asc,created_at.asc'});
}

const PWD_WARN_HTML=`<div class="alert ai" style="margin-top:8px;font-size:12px">⚠️ Questo utente esiste già in Supabase. La password non verrà modificata (lascia il campo vuoto).</div>`;
let _emailTimer=null;
async function checkEmailLive(emailInput,pwdGroup,pwdInput){
  clearTimeout(_emailTimer);
  _emailTimer=setTimeout(async()=>{
    const email=emailInput.value.trim().toLowerCase();
    if(!email.includes('@'))return;
    const r=await callFn('servizi-manage-user',{action:'check_email',email});
    if(r.exists){
      pwdInput.value='';pwdInput.disabled=true;pwdGroup.style.display='block';
      const w=pwdGroup.querySelector('.pwd-warn');
      if(!w)pwdGroup.insertAdjacentHTML('beforeend',PWD_WARN_HTML.replace('class="alert','class="pwd-warn alert'));
    } else {
      pwdInput.disabled=false;pwdGroup.style.display='block';
      const w=pwdGroup.querySelector('.pwd-warn');if(w)w.remove();
    }
  },500);
}

    if(m.tipo==='incasso_contante')incassiC+=Number(m.importo);

  pb.innerHTML=`
  <div class="page-hdr">
    <h1>La mia cassa</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="week-nav">
        <button onclick="changeWeek(-1)">◀ Prec.</button>
        <span class="week-label" id="wklbl">${weekLabel()}</span>
        <button onclick="changeWeek(1)" ${S.weekOffset>=0?'disabled style="opacity:.4"':''}>Succ. ▶</button>
      </div>
      ${isOpen?`<button class="btn bpg" onclick="openMovimentoForm()">+ Movimento</button>`:''}

  </div>

  ${sett&&sett.stato==='chiusa'?`<div class="alert aw" style="margin-bottom:16px">🔒 Settimana chiusa. Nessuna modifica possibile.</div>`:''}
  ${sett&&sett.stato==='sbloccata'?`<div class="alert aa" style="margin-bottom:16px">🔓 Settimana riaperta dall'amministratore.</div>`:''}

  <div class="stats-row">
    <div class="stat-card"><div class="stat-val">${eur(fondo)}</div><div class="stat-label">Fondo fisso</div></div>
    <div class="stat-card"><div class="stat-val green">${eur(incassiC)}</div><div class="stat-label">Incassi contante</div></div>
    <div class="stat-card"><div class="stat-val green">${eur(incassiA)}</div><div class="stat-label">Incassi assegni</div></div>
    <div class="stat-card"><div class="stat-val red">${eur(usciteNDC+usciteVarie)}</div><div class="stat-label">Uscite totali</div></div>
    <div class="stat-card"><div class="stat-val ${totConsegnare<0?'red':''}">${eur(saldo)}</div><div class="stat-label">Saldo cassa (incl. fondo)</div></div>
    <div class="stat-card" style="border-color:var(--verde);background:var(--blue-xlight)"><div class="stat-val">${eur(totConsegnare)}</div><div class="stat-label">Da consegnare (senza fondo)</div></div>
  </div>

    <div class="card-head">
      <span class="card-title">Movimenti settimana</span>

        ${Object.entries(TIPI).map(([k,v])=>`<span class="filter-chip ${S.movFiltroTipo===k?'active':''}" onclick="setMovFiltro('${k}')">${v.l}</span>`).join('')}

        <thead><tr><th>Data</th><th>Tipo</th><th>Importo</th><th>Descrizione</th><th>Giustificativo</th>${isOpen?'<th></th>':''}</tr></thead>

function movimentiRows(movimenti,isOpen){
  if(!movimenti.length)return'';
  return movimenti.map(m=>{
    const rowClass=m.tipo==='uscita_ndc'?'row-uscita-ndc':m.tipo.startsWith('uscita')?'row-uscita':'';
    const segno=tipoSign(m.tipo);
    const importoHTML=`<span style="font-weight:700;color:${segno>0?'#1A7A40':'var(--red)'}">${segno>0?'+':'−'}${eur(Math.abs(m.importo))}</span>`;
    const gjBtn=m.giustificativo_path
      ?`<button class="btn bs" style="padding:4px 9px;font-size:11px" onclick="viewGiustificativo('${esc(m.giustificativo_path)}')">📎 Vedi</button>`
      :'—';
    const editDel=isOpen&&m.operatore_id===S.user.id
      ?`<div style="display:flex;gap:6px">
          <button class="bic" title="Modifica" onclick="openMovimentoForm(${JSON.stringify(JSON.stringify(m))})">✏️</button>
          <button class="bic" title="Elimina" onclick="eliminaMovimento('${m.id}')">🗑️</button>
        </div>`:'';
    return`<tr class="${rowClass}">
      <td>${fmt(m.data_movimento)}</td>
      <td>${tipoBadge(m.tipo)}</td>
      <td>${importoHTML}</td>
      <td style="max-width:220px;font-size:12px">${esc(m.descrizione||'—')}</td>
      <td>${gjBtn}</td>
      ${isOpen?`<td>${editDel}</td>`:''}
    </tr>`;
  }).join('');
}

function onTipoChange(){
  const tipo=$('mf-tipo').value;
  const needsDesc=tipo==='uscita_ndc'||tipo==='uscita_varie';
  $('mf-desc-group').style.display=needsDesc?'':'none';
}

async function salvaMovimento(existingId){
  const tipo=$('mf-tipo').value;
  const data=$('mf-data').value;
  const importo=parseFloat($('mf-importo').value);
  const desc=$('mf-desc').value.trim();
  const fileEl=$('mf-file');
  const errEl=$('mf-err');
  errEl.classList.add('hid');

  if(!tipo){errEl.textContent='Seleziona il tipo.';errEl.classList.remove('hid');return;}
  if(!data){errEl.textContent='Inserisci la data.';errEl.classList.remove('hid');return;}
  if(isNaN(importo)||importo<=0){errEl.textContent='Importo non valido.';errEl.classList.remove('hid');return;}
  if((tipo==='uscita_ndc'||tipo==='uscita_varie')&&!desc){errEl.textContent='Inserisci la descrizione/causale.';errEl.classList.remove('hid');return;}

  const btns=$('mft').querySelectorAll('button');btns.forEach(b=>b.disabled=true);

  try{
    let settimana=await getOrCreateSettimana();
    if(!settimana||!['aperta','sbloccata'].includes(settimana.stato)){
      throw new Error('La settimana non è aperta. Impossibile inserire movimenti.');
    }

    let gjPath=null;
    if(fileEl.files[0]){
      const tmpId=existingId||crypto.randomUUID();
      gjPath=await uploadGiustificativo(fileEl.files[0],tmpId);
    }

    const body={
      settimana_id:settimana.id,
      operatore_id:S.user.id,
      sede_id:S.user.sede_id,
      tipo,importo,
      data_movimento:data,
      descrizione:desc||null,
    };
    if(gjPath)body.giustificativo_path=gjPath;

    if(existingId){
      await db('PATCH',T('movimenti'),{flt:`id=eq.${existingId}`,body});
      writeLog('movimento_modificato',{id:existingId,tipo,importo});
    } else {
      await db('POST',T('movimenti'),{body:[body]});
      writeLog('movimento_aggiunto',{tipo,importo});
    }
    closeM();toast(existingId?'Movimento aggiornato':'Movimento aggiunto');
    await renderCassa();
  }catch(e){
    errEl.textContent=e.message;errEl.classList.remove('hid');
    btns.forEach(b=>b.disabled=false);
  }
}

async function eliminaMovimento(id){
  openConf('Eliminare questo movimento?',async()=>{
    try{
      await db('DELETE',T('movimenti'),{flt:`id=eq.${id}`});
      writeLog('movimento_eliminato',{id});
      toast('Movimento eliminato');await renderCassa();
    }catch(e){toast(e.message,'terr');}
  });
}

function openConfermaForm(settimanaId,sedeId,cJsonStr){
  const c=cJsonStr?JSON.parse(cJsonStr):null;
  openM(c?'Modifica conferma':'Conferma contabilità',`
    <div class="alert ai" style="margin-bottom:16px">Inserisci gli importi da gestionale e il contante effettivamente consegnato per questa settimana.</div>
    <div class="fr">
      <div class="fg">
        <label class="fl">Importo gestionale (€)</label>
        <input type="number" class="fi" id="cf-gest" value="${c?.importo_gestionale||''}" step="0.01" placeholder="0,00">
      </div>
      <div class="fg">
        <label class="fl">Importo consegnato (€)</label>
        <input type="number" class="fi" id="cf-cons" value="${c?.importo_consegnato||''}" step="0.01" placeholder="0,00">
      </div>
    </div>
    <div class="fg">
      <label class="fl">Note</label>
      <textarea class="fta" id="cf-note">${esc(c?.note||'')}</textarea>
    </div>
    <div id="cf-err" class="alert aw hid" style="margin-top:8px"></div>
  `,[
    {l:'Annulla',cls:'bs',fn:closeM},
    {l:'Salva conferma',cls:'bpg',fn:()=>salvaConferma(settimanaId,c?.id||null)},
  ]);
}

async function salvaConferma(settimanaId,existingId){
  const gest=parseFloat($('cf-gest').value);
  const cons=parseFloat($('cf-cons').value);
  const note=$('cf-note').value.trim();
  const errEl=$('cf-err');errEl.classList.add('hid');
  if(isNaN(gest)||isNaN(cons)){errEl.textContent='Inserisci entrambi gli importi.';errEl.classList.remove('hid');return;}
  try{
    const body={settimana_id:settimanaId,contabilita_id:S.user.id,importo_gestionale:gest,importo_consegnato:cons,note:note||null,confermato_at:new Date().toISOString()};
    if(existingId){
      await db('PATCH',T('conferme'),{flt:`id=eq.${existingId}`,body});
    } else {
      await db('POST',T('conferme'),{body:[body]});
    }
    writeLog('conferma_contabilita',{settimana_id:settimanaId,delta:cons-gest});
    closeM();toast('Conferma salvata');await renderConferme();
  }catch(e){
    $('cf-err').textContent=e.message;$('cf-err').classList.remove('hid');
  }
}

        <thead><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Sede</th><th>Fondo cassa</th><th>Stato</th><th></th></tr></thead>
        <tbody>
          ${profili.map(p=>`<tr class="${p.attivo===false?'row-annullata':''}">
            <td><strong>${esc(fullName(p))}</strong></td>
            <td style="font-size:12px">${esc(p.email)}</td>
            <td>${ruoloBadge(p.ruolo)}</td>
            <td>${esc(sedeLabel(p.sede_id))}</td>
            <td style="font-weight:700">${eur(p.fondo_cassa)}</td>
            <td><span class="bg ${p.attivo===false?'bg-off':'bg-on'}">${p.attivo===false?'Inattivo':'Attivo'}</span></td>
            <td>
              <div style="display:flex;gap:6px">
                <button class="bic" title="Modifica" onclick="openUtenteForm(${JSON.stringify(JSON.stringify(p))})">✏️</button>
                ${p.id!==S.user.id?`<button class="bic" title="Elimina profilo" onclick="eliminaUtente('${p.id}','${esc(fullName(p))}')">🗑️</button>`:''}
              </div>
            </td>
          </tr>`).join('')}
          ${profili.length===0?`<tr><td colspan="7" class="empty-row">Nessun utente.</td></tr>`:''}
        </tbody>
      </table>
    </div>
  </div>`;
}

function openUtenteForm(jsonStr){
  const p=jsonStr?JSON.parse(jsonStr):null;
  const sedeOpts=S.sedi.map(s=>`<option value="${s.id}" ${p?.sede_id===s.id?'selected':''}>${esc(s.nome||s.indirizzo||s.id)}</option>`).join('');
  openM(p?'Modifica utente':'Nuovo utente',`
    <div class="fr">
      <div class="fg"><label class="fl">Nome *</label><input type="text" class="fi" id="uf-nome" value="${esc(p?.nome||'')}" required></div>
      <div class="fg"><label class="fl">Cognome *</label><input type="text" class="fi" id="uf-cognome" value="${esc(p?.cognome||'')}" required></div>
    </div>
    <div class="fg" id="uf-email-group">
      <label class="fl">Email *</label>
      <input type="email" class="fi" id="uf-email" value="${esc(p?.email||'')}" ${p?'disabled':''} ${p?'':'oninput="checkEmailLive(this,$(\\'uf-pwd-group\\'),$(\\'uf-pwd\\'))"'} required>
    </div>
    <div class="fg" id="uf-pwd-group" style="${p?'':'display:none'}">
      <label class="fl">Password ${p?'(lascia vuoto per non modificare)':'*'}</label>
      <input type="password" class="fi" id="uf-pwd" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="fr">
      <div class="fg">
        <label class="fl">Ruolo *</label>
        <select class="fse" id="uf-ruolo">
          ${['admin','operatore','responsabile','contabilita'].map(r=>`<option value="${r}" ${p?.ruolo===r?'selected':''}>${{admin:'Admin',operatore:'Operatore',responsabile:'Responsabile',contabilita:'Contabilità'}[r]}</option>`).join('')}
        </select>
      </div>
      <div class="fg">
        <label class="fl">Sede</label>
        <select class="fse" id="uf-sede"><option value="">— nessuna —</option>${sedeOpts}</select>
      </div>
    </div>
    <div class="fr">
      <div class="fg">
        <label class="fl">Fondo cassa (€)</label>
        <input type="number" class="fi" id="uf-fondo" value="${p?.fondo_cassa!=null?p.fondo_cassa:S.config.fondo_default||200}" step="0.01" min="0">
      </div>
      <div class="fg" style="justify-content:flex-end;align-items:flex-end">
        <label class="tw"><div class="tg"><input type="checkbox" id="uf-attivo" ${p===null||p?.attivo!==false?'checked':''}><span class="tsl"></span></div><span style="font-size:13px;font-weight:600">Utente attivo</span></label>
      </div>
    </div>
    <div id="uf-err" class="alert aw hid" style="margin-top:8px"></div>
  `,[
    {l:'Annulla',cls:'bs',fn:closeM},
    {l:p?'Salva':'Crea utente',cls:'bpg',fn:()=>salvaUtente(p?.id||null)},
  ],false);
  // Mostra campo password per nuovo utente
  if(!p)$('uf-pwd-group').style.display='block';
}

async function salvaUtente(existingId){
  const nome=$('uf-nome').value.trim();
  const cognome=$('uf-cognome').value.trim();
  const email=$('uf-email').value.trim().toLowerCase();
  const pwd=$('uf-pwd').value;
  const ruolo=$('uf-ruolo').value;
  const sede=$('uf-sede').value||null;
  const fondo=parseFloat($('uf-fondo').value)||0;
  const attivo=$('uf-attivo').checked;
  const errEl=$('uf-err');errEl.classList.add('hid');
  if(!nome||!cognome){errEl.textContent='Nome e cognome obbligatori.';errEl.classList.remove('hid');return;}

  try{
    if(existingId){
      // Update via edge function (gestisce password)
      const r=await callFn('servizi-manage-user',{action:'update',user_id:existingId,password:pwd||undefined,nome,cognome,ruolo,attivo});
      if(!r.ok)throw new Error(r.error||'Errore aggiornamento');
      // Aggiorna sede e fondo_cassa direttamente
      await db('PATCH',T('profili'),{flt:`id=eq.${existingId}`,body:{sede_id:sede,fondo_cassa:fondo}});
    } else {
      if(!email){errEl.textContent='Email obbligatoria.';errEl.classList.remove('hid');return;}
      const r=await callFn('servizi-manage-user',{action:'create',email,password:pwd,nome,cognome,ruolo,attivo});
      if(!r.ok)throw new Error(r.error||'Errore creazione');
      // Aggiorna sede e fondo_cassa
      await db('PATCH',T('profili'),{flt:`id=eq.${r.user_id}`,body:{sede_id:sede,fondo_cassa:fondo}});
    }
    writeLog(existingId?'utente_modificato':'utente_creato',{email,ruolo});
    closeM();toast(existingId?'Utente aggiornato':'Utente creato');
    await renderUtenti();
  }catch(e){
    errEl.textContent=e.message;errEl.classList.remove('hid');
  }
}

async function eliminaUtente(id,nome){
  openConf(`Eliminare il profilo di ${nome}? L'utente non potrà più accedere a questo tool.`,async()=>{
    try{
      const r=await callFn('servizi-manage-user',{action:'delete_profile',user_id:id});
      if(!r.ok)throw new Error(r.error||'Errore eliminazione');
      writeLog('utente_eliminato',{user_id:id,nome});
      toast('Profilo eliminato');await renderUtenti();
    }catch(e){toast(e.message,'terr');}
  });
}

// PAGINA — LOG
// ════════════════════════════════════════════════════════
const LOG_PER_PAGE=50;
async function renderLog(){
  const pb=$('pb');
  const offset=S.logPage*LOG_PER_PAGE;
  let flt=S.logSrch?`azione=ilike.*${encodeURIComponent(S.logSrch)}*`:'';
  const{data:logs,tot}=await db('GET',T('log'),{flt,ord:'created_at.desc',lim:`${offset},${LOG_PER_PAGE}`,cnt:true});
  const totalPages=Math.ceil(tot/LOG_PER_PAGE)||1;

  pb.innerHTML=`
  <div class="page-hdr">
    <h1>Log attività</h1>
    <div class="search-wrap">
      <input type="text" placeholder="Cerca azione…" value="${esc(S.logSrch)}" oninput="S.logSrch=this.value;S.logPage=0;renderLog()">
    </div>
  </div>
  <div class="card">
    <div class="card-body" style="padding:0">
      <table class="dt">
        <thead><tr><th>Data/ora</th><th>Utente</th><th>Azione</th><th>Dettagli</th></tr></thead>
        <tbody>
          ${logs.map(l=>{
            const p=profById(l.utente_id);
            return`<tr>
              <td style="white-space:nowrap;font-size:12px">${fmtDT(l.created_at)}</td>
              <td style="font-size:12px">${esc(p?fullName(p):l.utente_id||'—')}</td>
              <td><span class="bg bg-usr">${esc(l.azione)}</span></td>
              <td style="font-size:11px;color:var(--g500)">${l.dettagli?esc(JSON.stringify(l.dettagli)).substring(0,120):'—'}</td>
            </tr>`;
          }).join('')}
          ${logs.length===0?`<tr><td colspan="4" class="empty-row">Nessun log trovato.</td></tr>`:''}
        </tbody>
      </table>
    </div>
  </div>
  <div class="pag">
    <span class="pag-info">Pagina ${S.logPage+1} di ${totalPages} — ${tot} righe</span>
    ${Array.from({length:totalPages},(_, i)=>`<button class="${i===S.logPage?'active':''}" onclick="S.logPage=${i};renderLog()">${i+1}</button>`).join('')}
  </div>`;
}

async function salvaConfig(){
  const fondo=parseFloat($('cfg-fondo').value)||200;
  const geo=$('cfg-geo').checked;
  try{
    await db('PATCH',T('config'),{flt:'id=eq.1',body:{fondo_default:fondo,geo_enabled:geo}});
    S.config={...S.config,fondo_default:fondo,geo_enabled:geo};
    writeLog('config_aggiornata',{fondo_default:fondo,geo_enabled:geo});
    toast('Impostazioni salvate');
  }catch(e){toast(e.message,'terr');}
}
